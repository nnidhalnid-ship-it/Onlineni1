<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المنصة - Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    h1 { margin-bottom: 20px; color: #38bdf8; text-align: center; }
    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
    .card { background: #1e293b; border-radius: 10px; padding: 20px; border: 1px solid #334155; }
    .card h2 { margin-bottom: 15px; color: #f43f5e; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    
    table { width: 100%; border-collapse: collapse; text-align: right; }
    th, td { padding: 12px; border-bottom: 1px solid #334155; }
    th { background-color: #0f172a; color: #94a3b8; }
    input { padding: 6px 10px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: #fff; width: 100%; }
    button { padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-update { background-color: #0284c7; color: white; margin-left: 5px; }
    .btn-delete { background-color: #e11d48; color: white; }
    .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

    /* تصميم واجهة المحادثات المقسمة */
    .chat-container { display: flex; height: 500px; border: 1px solid #334155; border-radius: 8px; overflow: hidden; background: #0f172a; }
    .chat-list { width: 35%; border-left: 1px solid #334155; overflow-y: auto; background: #1e293b; }
    .chat-item { padding: 12px 15px; border-bottom: 1px solid #334155; cursor: pointer; transition: background 0.2s; }
    .chat-item:hover, .chat-item.active { background: #334155; }
    .chat-item-title { font-weight: bold; color: #38bdf8; margin-bottom: 4px; }
    .chat-item-sub { font-size: 12px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .chat-view { width: 65%; display: flex; flex-direction: column; background: #0f172a; }
    .chat-header { padding: 12px; background: #1e293b; border-bottom: 1px solid #334155; font-weight: bold; color: #f43f5e; }
    .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 10px; font-size: 14px; position: relative; }
    .msg-left { background: #334155; color: #fff; align-self: flex-start; border-bottom-right-radius: 0; }
    .msg-right { background: #0284c7; color: #fff; align-self: flex-end; border-bottom-left-radius: 0; }
    .msg-info { font-size: 10px; color: #cbd5e1; margin-top: 4px; display: flex; justify-content: space-between; gap: 10px; }
    .btn-msg-delete { background: transparent; color: #f43f5e; border: none; cursor: pointer; font-size: 11px; padding: 0; }
  </style>
</head>
<body>

  <h1>لوحة التحكم والإدارة الإدارية</h1>

  <div class="container">
    
    <!-- قسم إدارة الحسابات -->
    <div class="card">
      <h2>إدارة الحسابات وكلمات المرور</h2>
      <table>
        <thead>
          <tr>
            <th>الصورة</th>
            <th>اسم المستخدم</th>
            <th>كلمة المرور الجديدة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="usersTable"></tbody>
      </table>
    </div>

    <!-- قسم المحادثات المنسق -->
    <div class="card">
      <h2>مراقبة المحادثات والرسائل</h2>
      <div class="chat-container">
        
        <!-- قائمة المحادثات المتاحة -->
        <div class="chat-list" id="conversationsList">
          <div style="padding: 15px; color: #94a3b8; text-align: center;">جاري تحميل المحادثات...</div>
        </div>

        <!-- معاينة رسائل المحادثة المختارة -->
        <div class="chat-view">
          <div class="chat-header" id="chatHeader">اختر محادثة من القائمة لعرض الرسائل</div>
          <div class="messages-box" id="messagesBox"></div>
        </div>

      </div>
    </div>

  </div>

  <script>
    const SERVER_URL = window.location.origin;
    let groupedConversations = {};

    // جلب قائمة المستخدمين
    async function fetchUsers() {
      try {
        const res = await fetch(`${SERVER_URL}/api/admin/users`);
        const users = await res.json();
        const tbody = document.getElementById("usersTable");
        tbody.innerHTML = "";

        users.forEach(user => {
          tbody.innerHTML += `
            <tr>
              <td><img src="${user.avatar || 'https://via.placeholder.com/40'}" class="avatar-img"></td>
              <td><input type="text" id="user-${user._id}" value="${user.username}"></td>
              <td><input type="password" id="pass-${user._id}" placeholder="كلمة سر جديدة"></td>
              <td>
                <button class="btn-update" onclick="updateUser('${user._id}')">تحديث</button>
                <button class="btn-delete" onclick="deleteUser('${user._id}')">حذف</button>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error("خطأ في تحميل المستخدمين", err);
      }
    }

    async function updateUser(id) {
      const username = document.getElementById(`user-${id}`).value;
      const password = document.getElementById(`pass-${id}`).value;

      const body = { username };
      if (password) body.password = password;

      const res = await fetch(`${SERVER_URL}/api/admin/users/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      alert(data.message || "تم التحديث");
      fetchUsers();
    }

    async function deleteUser(id) {
      if (!confirm("هل أنت تأكد من حذف هذا الحساب؟")) return;
      await fetch(`${SERVER_URL}/api/admin/users/${id}`, { method: "DELETE" });
      fetchUsers();
    }

    // جلب الرسائل وتجميعها حسب الطرفين
    async function fetchMessages() {
      try {
        const res = await fetch(`${SERVER_URL}/api/admin/messages`);
        const messages = await res.json();
        
        groupedConversations = {};

        // تجميع الرسائل حسب الثنائي (مثلاً: UserA <-> UserB)
        messages.forEach(msg => {
          const key = [msg.sender, msg.recipient].sort().join(" ↔ ");
          if (!groupedConversations[key]) {
            groupedConversations[key] = [];
          }
          groupedConversations[key].push(msg);
        });

        renderConversationsList();
      } catch (err) {
        console.error("خطأ في تحميل الرسائل", err);
      }
    }

    // عرض قائمة المحادثات على اليمين
    function renderConversationsList() {
      const listContainer = document.getElementById("conversationsList");
      listContainer.innerHTML = "";

      const keys = Object.keys(groupedConversations);
      if (keys.length === 0) {
        listContainer.innerHTML = '<div style="padding: 15px; color: #94a3b8; text-align: center;">لا توجد محادثات حتى الآن</div>';
        return;
      }

      keys.forEach(key => {
        const msgs = groupedConversations[key];
        const lastMsg = msgs[0]; // أحدث رسالة

        let previewText = lastMsg.text || "[ملف مرفق]";
        
        listContainer.innerHTML += `
          <div class="chat-item" onclick="openConversation('${key}', this)">
            <div class="chat-item-title">${key}</div>
            <div class="chat-item-sub">${lastMsg.sender}: ${previewText}</div>
          </div>
        `;
      });
    }

    // فتح المحادثة وعرض رسائلها على اليسار
    function openConversation(key, element) {
      document.querySelectorAll(".chat-item").forEach(el => el.classList.remove("active"));
      if (element) element.classList.add("active");

      document.getElementById("chatHeader").innerText = `المحادثة: ${key}`;
      const box = document.getElementById("messagesBox");
      box.innerHTML = "";

      const msgs = groupedConversations[key].slice().reverse(); // ترتيب من الأقدم للأحدث

      const firstUser = key.split(" ↔ ")[0];

      msgs.forEach(msg => {
        const isFirst = msg.sender === firstUser;
        let content = msg.text || "";
        if (msg.fileUrl) {
          content += `<br><a href="${msg.fileUrl}" target="_blank" style="color:#38bdf8; font-weight:bold;">[فتح الملف المرفق]</a>`;
        }

        box.innerHTML += `
          <div class="msg-bubble ${isFirst ? 'msg-right' : 'msg-left'}">
            <div style="font-size: 11px; font-weight: bold; margin-bottom: 2px;">${msg.sender}</div>
            <div>${content}</div>
            <div class="msg-info">
              <span>${new Date(msg.timestamp).toLocaleTimeString("ar-EG", {hour: '2-digit', minute:'2-digit'})}</span>
              <button class="btn-msg-delete" onclick="deleteMessage('${msg._id}')">حذف</button>
            </div>
          </div>
        `;
      });

      box.scrollTop = box.scrollHeight;
    }

    async function deleteMessage(id) {
      if (!confirm("حذف هذه الرسالة؟")) return;
      await fetch(`${SERVER_URL}/api/admin/messages/${id}`, { method: "DELETE" });
      fetchMessages();
    }

    fetchUsers();
    fetchMessages();
  </script>
</body>
</html>
